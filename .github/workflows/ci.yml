name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: récupérer le code
        uses: actions/checkout@v4

      - name: installer python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: installer les dependences
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: lancer le linter
        run: |
          flake8 app tests --count --select=E9,F63,F7,F82,F841 --show-source --statistics
          flake8 app tests --count --max-complexity=10 --max-line-length=127 --statistics


  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: récupérer le code
        uses: actions/checkout@v4

      - name: installer python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: installer les dependences
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: lancer les tests
        run: |
          pytest tests/ -v --cov=app


  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: récupérer le code
        uses: actions/checkout@v4

      - name: installer python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: installer build
        run: pip install build

      - name: build du package
        run: python -m build

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist